[project]
name = "amplifier-cli"
version = "0.1.0"
description = "Foundation-based Amplifier CLI - 85% smaller than app-cli"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Amplifier Team" }
]

dependencies = [
    "amplifier-foundation>=0.1.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
amplifier = "amplifier_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
